name: Release

# Builds the Windows release for a version tag and publishes it as a
# GitHub release with exactly three assets:
#   ai.md-v<version>-x64-Setup.exe, ai.md-v<version>-x64-Portable.zip,
#   SHA256SUMS.txt
# Run it from the Actions tab (workflow_dispatch, giving the tag to
# create), or push a v* tag yourself; both paths end in the same place.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag and version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got: $tag" }
          $version = $tag.Substring(1)
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($cargo -ne $version) { throw "Cargo.toml version is $cargo but the tag says $tag" }
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV
          "SETUP_NAME=ai.md-v$version-x64-Setup.exe" >> $env:GITHUB_ENV
          "ZIP_NAME=ai.md-v$version-x64-Portable.zip" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install toolchain
        run: rustup component add clippy

      - name: Build, check and package with Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          & python scripts/check.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows checks failed' }
          & scripts/package-windows.ps1 -Iscc "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }

      - name: Assemble release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $built = Get-ChildItem 'dist/windows/unsigned/quiet-md-*-windows-x64-setup.exe' | Select-Object -First 1
          if (!$built) { throw 'Packaged setup exe not found' }
          Copy-Item $built.FullName $env:SETUP_NAME
          $stage = 'portable-stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'target/release/quiet_md.exe' "$stage/ai_md.exe"
          Copy-Item 'LICENSE' $stage
          Set-Content -Path "$stage/portable.txt" -Value 'Portable build marker: ai_md.exe keeps its library in the data folder beside this file.'
          Compress-Archive -Path "$stage/*" -DestinationPath $env:ZIP_NAME
          $lines = foreach ($f in @($env:SETUP_NAME, $env:ZIP_NAME)) {
            '{0}  {1}' -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f
          }
          ($lines -join "`n") + "`n" | Set-Content -NoNewline 'SHA256SUMS.txt'
          @"
          ai.md $env:TAG.

          A Catalog of AI prompts, MCP servers, skills and guides (one file per entry under catalog/), prompt variables with a Run prompt fill-in sheet, an Insert prompt palette, catalog results in the quick switcher, and a consent-gated Run for install commands. Every Quiet.md feature is unchanged, and existing libraries open as before. The application executable is ai_md.exe.

          Windows: **$env:SETUP_NAME** (installs for the current user; uninstalling never deletes your notes) or **$env:ZIP_NAME** (portable, no install; keeps its library in a data folder beside ai_md.exe). The builds are unsigned — if SmartScreen appears on first launch, click **More info → Run anyway**.
          "@ | Set-Content 'release-notes.md'

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:SETUP_NAME $env:ZIP_NAME SHA256SUMS.txt --clobber
          } else {
            gh release create $env:TAG $env:SETUP_NAME $env:ZIP_NAME SHA256SUMS.txt --target $env:GITHUB_SHA --title "ai.md $env:TAG" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
