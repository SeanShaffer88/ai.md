name: Release

# Builds the Windows release for a version tag and publishes it as a
# GitHub release with exactly three assets:
#   ai.md-v<version>-x64-Setup.exe, ai.md-v<version>-x64-Portable.zip,
#   SHA256SUMS.txt
# The assets are packaged by SeanPak (see seanpak.json); Inno Setup is
# retired. Run it from the Actions tab (workflow_dispatch, giving the
# tag to create), or push a v* tag yourself; both paths end in the
# same place.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag and version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got: $tag" }
          $version = $tag.Substring(1)
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($cargo -ne $version) { throw "Cargo.toml version is $cargo but the tag says $tag" }
          $manifest = Get-Content seanpak.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "seanpak.json version is $($manifest.version) but the tag says $tag" }
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV
          "SETUP_NAME=ai.md-v$version-x64-Setup.exe" >> $env:GITHUB_ENV
          "ZIP_NAME=ai.md-v$version-x64-Portable.zip" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install toolchain
        run: rustup component add clippy

      - name: Build and check with Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          & python scripts/check.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows checks failed' }

      - name: Check out SeanPak
        uses: actions/checkout@v4
        with:
          repository: SeanShaffer88/SeanPak
          ref: main
          path: .seanpak

      - name: Package with SeanPak
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools were not found' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'rustup target add failed' }
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          # Build SeanPak outside this repo's tree: inside it, cargo
          # mistakes SeanPak's manifest for a member of ai.md's own
          # workspace and refuses to build it.
          $sp = Join-Path $env:RUNNER_TEMP 'seanpak'
          Move-Item '.seanpak' $sp
          & cargo build --release --target x86_64-pc-windows-msvc --manifest-path (Join-Path $sp 'Cargo.toml')
          if ($LASTEXITCODE -ne 0) { throw 'SeanPak build failed' }
          $seanpak = Join-Path $sp 'target/x86_64-pc-windows-msvc/release/seanpak.exe'
          & $seanpak validate seanpak.json
          if ($LASTEXITCODE -ne 0) { throw 'SeanPak manifest validation failed' }
          $stage = 'dist/files'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'target/release/ai_md.exe' "$stage/ai_md.exe"
          if (!$env:VCToolsRedistDir) { throw 'VCToolsRedistDir is not set in the developer shell' }
          $runtime = Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC*.CRT/vcruntime140.dll') | Select-Object -First 1
          if (!$runtime) { throw 'The redistributable x64 vcruntime140.dll was not found' }
          Copy-Item $runtime.FullName $stage
          $runtime1 = Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC*.CRT/vcruntime140_1.dll') | Select-Object -First 1
          if (!$runtime1) { throw 'The redistributable x64 vcruntime140_1.dll was not found' }
          Copy-Item $runtime1.FullName $stage
          Copy-Item 'LICENSE' $stage
          Copy-Item 'THIRD_PARTY.md' $stage
          & $seanpak pack seanpak.json $stage --out-dir dist-seanpak --json
          if ($LASTEXITCODE -ne 0) { throw 'SeanPak pack failed' }
          & $seanpak verify "dist-seanpak/$env:SETUP_NAME" --sandbox
          if ($LASTEXITCODE -ne 0) { throw 'SeanPak sandbox verify failed' }

      - name: Assemble release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "dist-seanpak/$env:SETUP_NAME" $env:SETUP_NAME
          # SeanPak packs one file set for both assets; ai.md tells a
          # portable build by the portable.txt marker beside the exe, so
          # the marker goes into the portable zip only, never the install.
          $stage = 'portable-stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Expand-Archive -Path "dist-seanpak/$env:ZIP_NAME" -DestinationPath $stage
          Set-Content -Path "$stage/portable.txt" -Value 'Portable build marker: ai_md.exe keeps its library in the data folder beside this file.'
          Compress-Archive -Path "$stage/*" -DestinationPath $env:ZIP_NAME
          $lines = foreach ($f in @($env:SETUP_NAME, $env:ZIP_NAME)) {
            '{0}  {1}' -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f
          }
          ($lines -join "`n") + "`n" | Set-Content -NoNewline 'SHA256SUMS.txt'
          @"
          ai.md $env:TAG.

          New in 0.7.0: a unified command palette with typed queries (mcp:, skill:, prompt:, note:, >) and preview cards; a Today rail and Library Spaces in the sidebar; a quick-capture window (Alt+Space) for running a favorite prompt or jotting a note; prompt packs you can export and import; Run profiles for prompt variables; catalog link health checks, license filters and duplicate tidy-up; an opt-in, token-guarded local agent bridge (off by default); an exit dialog with minimize-to-tray; ten new document themes inspired by Notepad++; and Enter now confirms dialogs, with an option to stop asking before deletes. Plus the Catalog of AI prompts, MCP servers, skills and guides, prompt variables with a Run prompt fill-in sheet, and a consent-gated Run for install commands. Every feature of the original app is unchanged, and existing libraries open as before. The application executable is ai_md.exe.

          Windows: **$env:SETUP_NAME** (installs for the current user with SeanPak, no admin rights needed; uninstalling never deletes your notes) or **$env:ZIP_NAME** (portable, no install; keeps its library in a data folder beside ai_md.exe). The builds are unsigned — if SmartScreen appears on first launch, click **More info → Run anyway**.
          "@ | Set-Content 'release-notes.md'

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:SETUP_NAME $env:ZIP_NAME SHA256SUMS.txt --clobber
          } else {
            gh release create $env:TAG $env:SETUP_NAME $env:ZIP_NAME SHA256SUMS.txt --target $env:GITHUB_SHA --title "ai.md $env:TAG" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
